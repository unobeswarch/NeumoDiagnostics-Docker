# ═══════════════════════════════════════════════════════════════════════════════
# NEUMODIAGNOSTICS - CI/CD PIPELINE
# ═══════════════════════════════════════════════════════════════════════════════
# Pipeline completo para build, push a ECR y despliegue de infraestructura
# ═══════════════════════════════════════════════════════════════════════════════

name: Infrastructure & Deployment

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'
      - '*/Dockerfile'
      - '*/requirements.txt'
      - '*/go.mod'
      - '*/package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.0'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # TERRAFORM VALIDATE & PLAN
  # ═══════════════════════════════════════════════════════════════════════════
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    outputs:
      plan-exists: ${{ steps.plan.outputs.exitcode == 0 }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: infra
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="docdb_master_password=${{ secrets.DOCDB_PASSWORD }}" \
            -var="mq_password=${{ secrets.MQ_PASSWORD }}" \
            -var="smtp_password=${{ secrets.SMTP_PASSWORD }}"
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        continue-on-error: true

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/tfplan

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Format 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Init ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validate 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            
            *Pushed by: @${{ github.actor }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD & PUSH DOCKER IMAGES TO ECR
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
          - name: auth-be
            context: ./auth-be
          - name: prediagnostic-be
            context: ./prediagnostic-be
          - name: notification-be
            context: ./notification-be
          - name: message-producer
            context: ./message-producer
          - name: web-frontend
            context: ./web-front-end
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/neumo/${{ matrix.service.name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/neumo/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # TERRAFORM APPLY
  # ═══════════════════════════════════════════════════════════════════════════
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan, build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

  # ═══════════════════════════════════════════════════════════════════════════
  # UPDATE ECS SERVICES (Force new deployment)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-services:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [terraform-apply, build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-be
          - prediagnostic-be
          - notification-be
          - message-producer
          - web-frontend
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force New Deployment
        run: |
          CLUSTER_NAME="neumo-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}-cluster"
          SERVICE_NAME="${{ matrix.service }}"
          
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment

      - name: Wait for Service Stability
        run: |
          CLUSTER_NAME="neumo-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}-cluster"
          SERVICE_NAME="${{ matrix.service }}"
          
          aws ecs wait services-stable \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME
        timeout-minutes: 10

