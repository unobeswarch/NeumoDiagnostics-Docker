events {
    worker_connections 1024;
}

http {
    # Rate limiting zones (must be defined early)
    limit_req_zone $binary_remote_addr zone=reg:10m rate=10r/m;

    # Custom log format to show upstream server
    log_format load_balancer '$remote_addr - [$time_local] "$request" '
                             '$status - Upstream: $upstream_addr '
                             'Response time: $upstream_response_time '
                             'Rate limit: $limit_req_status';

    # Logging
    access_log /var/log/nginx/access.log load_balancer;
    error_log /var/log/nginx/error.log;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Load balancer configuration for API Gateway instances
    upstream api_gateway {
        # Load balancing method: weighted round robin
        
        # API Gateway instances with weights
        server api-gateway-1:8080 weight=3 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8080 weight=2 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8080 weight=1 max_fails=3 fail_timeout=30s;
        
    }

    # HTTP only server block - API Gateway access
    server {
        listen 80 default_server;
        server_name _;

        # Add header to show which upstream server handled the request
        add_header X-Upstream-Server $upstream_addr always;

        # GraphQL endpoint
        location /graphql {
            proxy_pass http://api_gateway/query;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints
        location /auth {
           
            proxy_pass http://api_gateway/auth;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /upload {
            
            proxy_pass http://api_gateway/upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 10M;
        }

        location /register {
            
            limit_req zone=reg burst=1 nodelay;
            # Add debug info
            add_header X-Rate-Limit-Debug "zone=reg" always;
            proxy_pass http://api_gateway/register;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /userInfo {
            proxy_pass http://api_gateway/userInfo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /userImage {
            proxy_pass http://api_gateway/userImage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # GraphQL query endpoint (for mutations like image upload)
        location /query {
            proxy_pass http://api_gateway/query;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Important for file uploads
            client_max_body_size 10M;
        }

        # Prediagnostic endpoints
        location /prediagnostic/ {
            proxy_pass http://api_gateway/prediagnostic/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes
        location /api/ {
            proxy_pass http://api_gateway/;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
