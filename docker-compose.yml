networks:
  private:
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/26    # Internal services network
    internal: true                    # Ensures network isolation from external access
    labels:
      description: "Backend and Data Services Network"

  public:
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24      # External access network
    labels:
      description: "Frontend Public Access Network"

services:

  auth-db:
    image: postgres:15
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: auth_db
    expose:
      - "5432"
    volumes:
      - ./inicializacion_auth_db.sql:/docker-entrypoint-initdb.d/inicializacion_auth_db.sql
    networks:
      - private

  message-broker:
    image: rabbitmq:3-management
    container_name: message-broker
    expose:
      - "5672"    # AMQP port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private
  
  notification-be:
    build: ./notification-be
    container_name: notification-be
    env_file:
      - ./notification-be/.env
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - private
      - public

  prediagnostic-db:
    image: mongo
    restart: always
    container_name: prediagnostic-db
    expose:
      - "27017"
    networks:
      - private

  # API Gateway - Instance 1
  api-gateway-1:
    build: ./api-gateway
    container_name: api-gateway-1
    hostname: api-gateway-1
    expose:
      - "8080"
    depends_on:
      - auth-db
    networks:
      - private
    restart: unless-stopped

  # API Gateway - Instance 2
  api-gateway-2:
    build: ./api-gateway
    container_name: api-gateway-2
    hostname: api-gateway-2
    expose:
      - "8080"
    depends_on:
      - auth-db
    networks:
      - private
    restart: unless-stopped

  # API Gateway - Instance 3
  api-gateway-3:
    build: ./api-gateway
    container_name: api-gateway-3
    hostname: api-gateway-3
    expose:
      - "8080"
    depends_on:
      - auth-db
    networks:
      - private
    restart: unless-stopped

  prediagnostic-be:
    build: ./prediagnostic-be
    container_name: prediagnostic-be
    expose:
      - "8000"
    depends_on:
      - prediagnostic-db
    networks:
      - private

  web-front-end:
    build:
      context: ./web-front-end
      target: development
    container_name: web-front-end
    environment:
      - NODE_ENV=development
      - USE_HTTPS=true
      - HTTPS_PORT=3443
      - HTTP_PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://reverse-proxy  # Frontend accede al API a través del reverse proxy
    # Expose HTTPS and HTTP ports to allow direct user access
    ports:
      - "3443:3443"  # HTTPS
      - "3000:3000"  # HTTP redirect to HTTPS
    volumes:
      - ./reverse-proxy/certs:/app/certs
    depends_on:
      - reverse-proxy
    networks:
      - public

  auth-be:  
    build: ./auth-be
    container_name: auth-be
    expose:
      - "8081"
    networks:
      - private

  cli-front-end:
    build: ./cli-front-end
    container_name: cli-front-end
    tty: true
    stdin_open: true
    environment:
      # CLI accesses REST endpoints through reverse proxy
      API_GATEWAY_URL: "http://reverse-proxy"
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - reverse-proxy
      - auth-be
    networks:
      - public

  message-producer:
    build: ./message-producer
    container_name: message-producer
    expose:
      - "8082"
    depends_on:
      message-broker:
        condition: service_healthy
      notification-be:
        condition: service_started
    networks:
      - private

  reverse-proxy:
    build: ./reverse-proxy
    container_name: reverse-proxy
    ports:
      - "80:80"      # HTTP only - API Gateway access
    depends_on:
      - api-gateway-1
      - api-gateway-2
      - api-gateway-3
    networks:
      - private
      - public
    restart: unless-stopped

